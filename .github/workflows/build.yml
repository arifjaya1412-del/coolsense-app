# Membangun APK Android dan versi web (untuk iPhone) setiap kali kode diunggah ke GitHub.
name: Build CoolSense

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-coolsense
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          
      - name: Pasang paket
        run: npm install --no-audit --no-fund

      - name: Bangun tampilan aplikasi
        run: npm run build

      - name: Buat proyek Android
        run: npx cap add android

      - name: Pasang ikon dan splash screen
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor "#123A52" --iconBackgroundColorDark "#123A52"
          --splashBackgroundColor "#E9EFF2" --splashBackgroundColorDark "#0E1A21"

      - name: Salin tampilan ke Android
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CoolSense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CoolSense-apk
          path: CoolSense.apk

      - name: Terbitkan APK di halaman Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru CoolSense.apk \
            --title "CoolSense APK terbaru" \
            --notes "Dibuat otomatis dari commit ${{ github.sha }}. Unduh CoolSense.apk di bawah lalu pasang di HP Android." \
            --prerelease

  web:
    name: Versi web untuk iPhone
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
